site_name: Wraith's Notebook
site_url: https://wraithlyd.github.io/
site_description: Wraith 的学习笔记：课程、读书、工具与生活记录。
site_author: Wraith
copyright: '© 2026 <a href="https://github.com/WraithLyd">Wraith</a> · 记录于此，偶有所得'
repo_url: https://github.com/WraithLyd/WraithLyd.github.io
repo_name: WraithLyd.github.io
edit_uri: edit/master/docs/
dev_addr: '127.0.0.1:5500' #默认值
theme:
  name: 'material'
  custom_dir: docs/overrides
  palette:
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: grey
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode

    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: white
      toggle:
        icon: material/weather-night 
        name: Switch to light mode
  language: 'zh'
  font: false
  # font: 
  #   text: LXGW WenKai Screen 
  #   code: JetBrains Mono Regular, LXGW WenKai Screen
  logo: assets/images/logo.jpg #clipboard.svg
  favicon: assets/images/logo.jpg #assets/images/clipboard2.svg
  features:
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.action.edit
    - content.action.view
    - navigation.footer
    - content.tooltips
    - toc.follow
extra_css:
#   - https://cdn.tonycrane.cc/utils/katex.min.css
#   - https://cdn.tonycrane.cc/jbmono/jetbrainsmono.css
#   - https://cdn.tonycrane.cc/lxgw/lxgwscreen.css
  - stylesheets/extra.css?v=14
  - stylesheets/extratest.css?v=4
markdown_extensions:
  - toc:
      permalink: true
      toc_depth: 4
      # 默认 slugify 会把中文标题变成 _1/_2 这种顺序号：锚点不稳定，页内中文链接也全失效。
      # 用 pymdownx 的 slugify（保留 Unicode），得到 #最近更新 这样的锚点。
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - meta
  - def_list
  - attr_list
  - md_in_html
  - sane_lists
  - admonition
  - footnotes
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.snippets
  - pymdownx.magiclink
  - pymdownx.inlinehilite
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tabbed:
      alternate_style: true 
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.highlight:
      pygments_lang_class: true
      use_pygments: true
      auto_title: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search
  - git-revision-date-localized:
      type: datetime
      timezone: Asia/Shanghai
      #fallback_to_build_date: true
      enable_creation_date: true
  - glightbox:
      touchNavigation: true
      effect: zoom
      background: 'rgba(20, 18, 16, 0.92)'
      skip_classes:
        - no-lightbox

hooks:
  - hooks/recent_updates.py
extra_javascript:
  - assets/js/mathjax.js?v=2
  - assets/js/mathjax/tex-svg.js
nav:
  - Home: index.md
  - Course: 
    - course/index.md
    - Mathematical Basic:
      - Discrete Mathemtics: course/MathematicalBasic/DiscreteMathemtics.md
      - Calculus: course/MathematicalBasic/Calculus.md
      - College Physics: course/MathematicalBasic/CollegePhysics/电磁学.md
    - Program:
      - Python: 
        - course/python/index.md
        - Python入门: course/python/python1.md
        - 数据类型: course/python/python2.md
        - 条件语句: course/python/python3.md
        - 循环语句: course/python/python4.md
        - 函数: course/python/python5.md
      - BasicDataStructure:
        - course/Program/BasicDataStructure/index.md
        - 算法分析: course/Program/BasicDataStructure/AlgorithmAnalysis.md
        - 抽象数据结构: course/Program/BasicDataStructure/List.md
        - 树: course/Program/BasicDataStructure/Tree.md
        - 堆: course/Program/BasicDataStructure/Heap.md
        - 并查集: course/Program/BasicDataStructure/DisjointSet.md
        - 图: course/Program/BasicDataStructure/Graph.md
      - Cpp: 
        - course/Program/cpp/index.md
        - book: course/Program/cpp/1.md
    - ComputerSystem:
      - System2: 
        - course/ComputerSystem/ComputerSystem2/index.md
        - 指令集系统: course/ComputerSystem/ComputerSystem2/InstructionSet.md
        - 流水线: course/ComputerSystem/ComputerSystem2/pipeline.md
        - 流水线复习: course/ComputerSystem/ComputerSystem2/pipelinesum.md
        - lab4: course/ComputerSystem/ComputerSystem2/lab4.md
      - ComputerOrganization:
        - 计算机抽象及相关技术: course/ComputerOrganization/ComputerOrganization1.md
    - Economics: 
      - AgriculturalEconomics: 
        - course/Economics/AgriculturalEconomics/index.md
      - InternationalTrade: 
        - course/Economics/InternationalTrade/index.md
      - WesternEconomics: 
        - course/Economics/WesternEconomics/index.md
        - 微经-需求、供给和均衡价格: course/Economics/WesternEconomics/microeconomics1.md
    - Policy:
      - course/Policy/index.md
      - 影响公共政策制定的因素: course/Policy/3.md
      - 公共政策的制定过程: course/Policy/4.md
    - SoftwareSecurity:
      - course/SoftwareSecurity/lab1.md
  - Book Notes:
    - 社会认知论:
      - read/社会认知论/index.md
  - Tool:
    - tool/index.md
    - Mkdocs: tool/MkDocs.md
    - Photograph: tool/photography.md
    - Qwen Code: tool/Qwen.md
#   - C Code Display: c.md
  - Collection:
    - collection/index.md
    - 2022 sentence: collection/sentence.md
    - 2022 paragraph: collection/paragraph.md
    - 2023 sentence: collection/sentence2023.md
    - 2023 paragraph: collection/paragraph2023.md
    - CCTV collection: collection/cctv.md
    - verse: collection/verse.md
    - poem: collection/poem.md
    - elegance: collection/elegance.md
  - Life: life/index.md

# 内容还很少、也没成体系的页面：仍然构建（旧链接不会 404），但不进导航、也不报警告
